# cargo-deny configuration for the file-sandbox daemon.
# Run locally with:  cargo install cargo-deny --locked  &&  cargo deny check
# CI runs the security checks (advisories/bans/sources) as a hard gate.

[advisories]
version = 2
yanked = "deny"
# Add RUSTSEC ids here only with a written justification if one is ever
# unreachable in practice (keep the list empty so real advisories stay visible).
ignore = []

[bans]
# Surface accidental dependency bloat, but don't fail the build on duplicate
# transitive versions we don't control.
multiple-versions = "warn"
# A `version = "*"` dependency is a supply-chain footgun — never allow one.
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive licenses only — every direct/transitive crate today resolves to one
# of these. A copyleft or unknown license should be a deliberate decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
