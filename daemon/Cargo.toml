[package]
name = "file-sandbox-daemon"
version = "0.1.0"
edition = "2021"
description = "Native Rust file-sandbox daemon (port of the TS/Node watcher)"

[[bin]]
name = "file-sandbox-daemon"
path = "src/main.rs"

[lib]
name = "file_sandbox_daemon"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "io-util", "process", "sync", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
notify = "6"
axum = "0.7"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
