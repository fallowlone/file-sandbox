[Distribution]
Distribution=debian
Release=bookworm
Mirror=https://snapshot.debian.org/archive/debian/20260501T000000Z/
Architecture=arm64

[Output]
Format=directory
Output=build/rootfs
ImageId=filesandbox-sandbox
ImageVersion=0.1.0

[Content]
Bootable=yes
Packages=
    linux-image-arm64
    systemd
    systemd-sysv
    init
    udev
    dbus
    apparmor
    apparmor-utils
    xfce4
    xfce4-session
    xinit
    evince
    eog
    mpv
    libreoffice
    file
    binutils
    ca-certificates
    fonts-dejavu
    virtio-fs-utils

RemoveFiles=
    /usr/share/doc
    /usr/share/man
    /usr/share/info
    /var/cache/apt/archives/*.deb
